name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Ruby version comes from .ruby-version
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

      - name: Upload overlap report
        uses: actions/upload-artifact@v7
        with:
          name: overlap-report
          path: reports/sample-overlap-report.md
          if-no-files-found: error
